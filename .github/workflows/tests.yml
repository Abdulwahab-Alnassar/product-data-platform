name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and integration tests
        run: python -m pytest -v
      - name: Run pipeline on the public sample
        run: python -m src.pipeline --input data/sample/amazon_sample.csv --output-dir data/processed/ci-demo
      - name: Run saved SQL analysis
        run: python -m src.analyze_data --database data/processed/ci-demo/products.db
