name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run unit and integration tests
        run: python -m pytest -v
      - name: Run pipeline on the public sample
        run: python -m src.pipeline --input data/sample/amazon_sample.csv --output-dir data/processed/ci-demo
      - name: Run saved SQL analysis
        run: python -m src.analyze_data --database data/processed/ci-demo/products.db
      - name: Train and evaluate the included demo
        run: python -m src.demo --output-dir data/processed/demo
      - name: Evaluate retrieval and monitor the catalog
        env:
          SQLITE_PATH: data/processed/demo/products.db
        run: |
          python -m src.evaluate_search
          python -m src.monitor

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: products_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_disposable_password@localhost:5432/products_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -v -m postgres

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci_disposable_password
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and start complete demo
        run: docker compose up --build -d --wait dashboard api
      - name: Verify dashboard and stored products
        run: |
          curl --fail http://localhost:8501/_stcore/health
          docker compose exec -T dashboard python -c "from src.query_data import load_analytics; data=load_analytics('postgres'); assert len(data)>0; print('Products:', len(data))"
          docker compose exec -T api python -m src.smoke
      - name: Verify a real backup can be restored
        run: |
          docker compose exec -T db pg_dump -U products_app -d products -Fc -f /tmp/products.backup
          docker compose exec -T db createdb -U products_app restore_check
          docker compose exec -T db pg_restore -U products_app -d restore_check --exit-on-error /tmp/products.backup
          docker compose exec -T db psql -U products_app -d restore_check -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM products) <> 100 THEN RAISE EXCEPTION 'Restore count mismatch'; END IF; END \$\$;"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down
