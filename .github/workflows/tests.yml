name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and integration tests
        run: python -m pytest -v
      - name: Run pipeline on the public sample
        run: python -m src.pipeline --input data/sample/amazon_sample.csv --output-dir data/processed/ci-demo
      - name: Run saved SQL analysis
        run: python -m src.analyze_data --database data/processed/ci-demo/products.db

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: products_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_disposable_password@localhost:5432/products_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v -m postgres

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci_disposable_password
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and start complete demo
        run: docker compose up --build -d --wait dashboard
      - name: Verify dashboard and stored products
        run: |
          curl --fail http://localhost:8501/_stcore/health
          docker compose exec -T dashboard python -c "from src.query_data import load_analytics; data=load_analytics('postgres'); assert len(data)>0; print('Products:', len(data))"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down
